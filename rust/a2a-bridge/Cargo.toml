[package]
name = "bitchat-a2a-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
a2a = { package = "a2a-lf", git = "https://github.com/a2aproject/a2a-rs", rev = "fc7caf3aa4e000e7a22dc369335babfb3ea300e4" }
uniffi = { version = "0.29", features = ["cli"] }

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }
